name: Build

on:
  push:
  pull_request:

# Drop redundant runs when a branch is updated quickly (e.g. push + PR sync).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_lib:
    name: Build xdvdfs-core for ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p xdvdfs

      - name: Test
        run: cargo test -p xdvdfs

  build_cli_linux:
    name: Build xdvdfs-cli for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p xdvdfs-cli --release

      - name: Test
        run: cargo test -p xdvdfs-cli

      - name: Package artifact
        run: zip -j xdvdfs-linux-x64-${{ github.sha }}.zip LICENSE target/release/xdvdfs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdvdfs-linux-x64-${{ github.sha }}
          path: xdvdfs-linux-x64-${{ github.sha }}.zip

  build_cli_linux_arm64:
    name: Build xdvdfs-cli for Linux (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # Cross-compiled on an x64 runner, so the binary can't be executed here (no test step).
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p xdvdfs-cli --release --target aarch64-unknown-linux-gnu

      - name: Package artifact
        run: |
          chmod +x target/aarch64-unknown-linux-gnu/release/xdvdfs
          zip -j xdvdfs-linux-arm64-${{ github.sha }}.zip LICENSE target/aarch64-unknown-linux-gnu/release/xdvdfs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdvdfs-linux-arm64-${{ github.sha }}
          path: xdvdfs-linux-arm64-${{ github.sha }}.zip

  build_cli_windows:
    name: Build xdvdfs-cli for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p xdvdfs-cli --release

      - name: Test
        run: cargo test -p xdvdfs-cli

      - name: Package artifact
        run: 7z a xdvdfs-windows-x64-${{ github.sha }}.zip ./LICENSE ./target/release/xdvdfs.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdvdfs-windows-x64-${{ github.sha }}
          path: xdvdfs-windows-x64-${{ github.sha }}.zip

  build_cli_windows_arm64:
    name: Build xdvdfs-cli for Windows (arm64)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      # Cross-compiled on an x64 runner, so the binary can't be executed here (no test step).
      - name: Build
        run: cargo build -p xdvdfs-cli --release --target aarch64-pc-windows-msvc

      - name: Package artifact
        run: 7z a xdvdfs-windows-arm64-${{ github.sha }}.zip ./LICENSE ./target/aarch64-pc-windows-msvc/release/xdvdfs.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdvdfs-windows-arm64-${{ github.sha }}
          path: xdvdfs-windows-arm64-${{ github.sha }}.zip

  build_cli_macos:
    name: Build xdvdfs-cli for macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build -p xdvdfs-cli --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test -p xdvdfs-cli --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          chmod +x target/${{ matrix.target }}/release/xdvdfs
          zip -j xdvdfs-macos-${{ matrix.arch }}-${{ github.sha }}.zip LICENSE target/${{ matrix.target }}/release/xdvdfs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdvdfs-macos-${{ matrix.arch }}-${{ github.sha }}
          path: xdvdfs-macos-${{ matrix.arch }}-${{ github.sha }}.zip

  build_web:
    name: Build (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Build
        run: trunk build --release
        working-directory: ./xdvdfs-web

      - name: Package artifact
        run: zip xdvdfs-web-${{ github.sha }}.zip -r dist
        working-directory: ./xdvdfs-web

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdvdfs-web-${{ github.sha }}
          path: xdvdfs-web/xdvdfs-web-${{ github.sha }}.zip

  build_fsd_linux:
    name: Build for Linux (xdvdfs-fsd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p xdvdfs-fsd --release

      - name: Package artifact
        run: zip -j xdvdfs-fsd-linux-${{ github.sha }}.zip LICENSE target/release/xdvdfsd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdvdfs-fsd-linux-${{ github.sha }}
          path: xdvdfs-fsd-linux-${{ github.sha }}.zip

  build_fsd_windows:
    name: Build for Windows (xdvdfs-fsd)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p xdvdfs-fsd --release

      - name: Package artifact
        run: 7z a xdvdfs-fsd-windows-${{ github.sha }}.zip ./LICENSE ./target/release/xdvdfsd.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdvdfs-fsd-windows-${{ github.sha }}
          path: xdvdfs-fsd-windows-${{ github.sha }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      [
        build_cli_linux,
        build_cli_linux_arm64,
        build_cli_windows,
        build_cli_windows_arm64,
        build_cli_macos,
        build_web,
        build_fsd_linux,
        build_fsd_windows,
      ]
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Must match upload-artifact@v4 (v3 cannot consume v4 artifacts).
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Get latest two tags, reverse order, then get log between those tags
      - name: Generate release notes
        run: git tag --sort=-version:refname | head -n 2 | tac | sed 'N;s/\n/../' | xargs git log --oneline --no-decorate | tee ${{ github.workspace }}-changelog.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: ${{ github.workspace }}-changelog.txt
          files: |
            out/*.zip
